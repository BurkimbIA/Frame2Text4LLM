name: Publish to PyPI
on:
  push:
    tags: ["v*.*.*"]  # pushing the release tag publishes it (RELEASE.md)
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/frame2text4llm/
    permissions:
      id-token: write  # Trusted Publishing: PyPI trusts this workflow, no token is stored
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"  # earlier uv ships the compromised emSign ECC Root CA - G3
      - name: Check that the tag is the project version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project.version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
