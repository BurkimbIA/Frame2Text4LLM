[project]
name = "frame2text4llm"
version = "0.1.0"
description = "Read the subtitles burned into a video with OCR, and cut the audio under each one, to build speech and text datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alban NYANTUDRE" },
    { name = "Salif SAWADOGO" },
]
maintainers = [
    { name = "Alban NYANTUDRE, Salif SAWADOGO", email = "frame2text4llm@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["ocr", "subtitles", "video", "speech", "dataset"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beartype",
    "datasets",
    "huggingface-hub",
    "loguru>=0.5.0",
    "matplotlib",
    "mistralai<2",  # later versions no longer export Mistral from the package root
    "numpy",
    "opencv-python",
    "pandas",
    "pydub",
    "pytubefix",
    "scipy",
    "soundfile",
    "tqdm",
]

[project.optional-dependencies]
easyocr = ["easyocr"]
paddle = ["paddleocr>=3.1,<4", "paddlepaddle>=3"]  # the 3.x API: PaddleOCR.predict
vlm = ["torch", "torchvision", "transformers>=4.57", "accelerate", "pillow", "einops", "timm"]
openai = ["openai"]
lid = ["torch", "transformers>=4.57"]
all = ["frame2text4llm[easyocr,paddle,vlm,openai,lid]"]

[project.urls]
Homepage = "https://github.com/BurkimbIA/Frame2Text4LLM"
Issues = "https://github.com/BurkimbIA/Frame2Text4LLM/issues"
Changelog = "https://github.com/BurkimbIA/Frame2Text4LLM/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame2text4llm"]

[tool.hatch.build.targets.sdist]
include = ["src/frame2text4llm", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "pytest>=7.4.0", "ruff>=0.14.10"]
docs = ["mkdocs<2", "mkdocs-material", "mkdocstrings[python]"]  # MkDocs 2 drops plugins

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "build", "dist", "sandbox", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # the package re-exports its classes
# their prompts are triple-quoted text the model reads as is: cutting a line would change it
"src/frame2text4llm/ocr/tools/openaiocr.py" = ["E501"]
"src/frame2text4llm/ocr/tools/vlmocr.py" = ["E501"]
